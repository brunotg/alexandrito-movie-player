<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parrot Transition Timer</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(#b9efff 0%, #e9fbff 72%, #b9e58c 72%, #9bd56e 100%);
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 500px;
  }

  .sun {
    position: absolute;
    top: 6vh;
    right: 8vw;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #ffd84d;
    box-shadow: 0 0 35px #ffe991;
  }

  .cloud {
    position: absolute;
    width: 170px;
    height: 45px;
    background: white;
    border-radius: 40px;
    opacity: .8;
  }
  .cloud:before, .cloud:after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud:before { width: 65px; height: 65px; left: 25px; top: -30px; }
  .cloud:after { width: 80px; height: 80px; left: 80px; top: -42px; }
  .c1 { top: 15vh; left: 7vw; }
  .c2 { top: 29vh; right: 18vw; transform: scale(.7); }

  .title {
    position: absolute;
    top: 6vh;
    left: 5vw;
    color: #24435c;
    font-size: clamp(28px, 4vw, 56px);
    font-weight: 900;
    text-shadow: 0 3px white;
  }

  .subtitle {
    position: absolute;
    top: 14vh;
    left: 5vw;
    color: #41647a;
    font-size: clamp(18px, 2vw, 30px);
    font-weight: bold;
  }

  .branch {
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: 17%;
    height: 30px;
    background: #80532f;
    border-radius: 30px;
    transform: rotate(-2deg);
    box-shadow: inset 0 7px 0 rgba(255,255,255,.12);
  }

  .leaf {
    position: absolute;
    width: 80px;
    height: 38px;
    border-radius: 100% 0 100% 0;
    background: #54ad52;
    transform: rotate(-25deg);
  }
  .l1 { left: 18%; bottom: 21%; }
  .l2 { right: 20%; bottom: 22%; transform: rotate(30deg); }
  .l3 { left: 42%; bottom: 20%; transform: rotate(55deg) scale(.8); }

  .parrot-wrap {
    position: absolute;
    left: 50%;
    bottom: 18%;
    width: 250px;
    height: 330px;
    transform: translateX(-50%);
    animation: jump 1.6s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

  @keyframes jump {
    0%, 100% { transform: translate(-50%, 0) rotate(0deg); }
    20% { transform: translate(-50%, -18px) rotate(-2deg); }
    50% { transform: translate(-50%, -105px) rotate(2deg); }
    75% { transform: translate(-50%, -28px) rotate(-1deg); }
  }

  .parrot {
    position: absolute;
    left: 38px;
    bottom: 40px;
    width: 165px;
    height: 215px;
    background: #35b957;
    border-radius: 55% 52% 45% 48%;
    box-shadow: inset -18px -12px 0 rgba(0,0,0,.08);
  }

  .belly {
    position: absolute;
    left: 35px;
    top: 75px;
    width: 95px;
    height: 120px;
    border-radius: 50%;
    background: #ffd84f;
  }

  .wing {
    position: absolute;
    left: -25px;
    top: 65px;
    width: 75px;
    height: 125px;
    border-radius: 60% 30% 70% 50%;
    background: #168fd1;
    transform-origin: 85% 20%;
    animation: flap 0.8s ease-in-out infinite alternate;
  }
  @keyframes flap {
    from { transform: rotate(12deg); }
    to { transform: rotate(-18deg); }
  }

  .head {
    position: absolute;
    left: 25px;
    top: -42px;
    width: 125px;
    height: 120px;
    border-radius: 50%;
    background: #39c55b;
  }

  .eye {
    position: absolute;
    right: 27px;
    top: 27px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: white;
    border: 3px solid #222;
  }
  .eye:after {
    content: "";
    position: absolute;
    left: 10px;
    top: 8px;
    width: 11px;
    height: 14px;
    border-radius: 50%;
    background: #111;
  }

  .beak {
    position: absolute;
    right: -31px;
    top: 52px;
    width: 50px;
    height: 38px;
    background: #ff8b25;
    clip-path: polygon(0 0, 100% 40%, 0 100%);
  }
  .beak2 {
    position: absolute;
    right: -25px;
    top: 65px;
    width: 38px;
    height: 25px;
    background: #e75b27;
    clip-path: polygon(0 0, 100% 40%, 0 100%);
  }

  .tail {
    position: absolute;
    left: 48px;
    bottom: -45px;
    width: 75px;
    height: 100px;
    background: #246fd1;
    clip-path: polygon(50% 0, 100% 100%, 0 78%);
    transform: rotate(8deg);
  }

  .foot {
    position: absolute;
    bottom: 10px;
    width: 55px;
    height: 18px;
    border-radius: 50%;
    background: #ff9f25;
  }
  .foot:after {
    content: "";
    position: absolute;
    width: 65px;
    height: 9px;
    background: #ff9f25;
    left: 10px;
    top: 5px;
    border-radius: 20px;
  }
  .f1 { left: 58px; }
  .f2 { left: 116px; }

  .watch {
    position: absolute;
    right: -48px;
    top: 65px;
    width: 105px;
    height: 125px;
    z-index: 5;
  }

  .watch-strap {
    position: absolute;
    left: 32px;
    top: -7px;
    width: 41px;
    height: 139px;
    border-radius: 18px;
    background: #536276;
  }

  .watch-face {
    position: absolute;
    left: 0;
    top: 18px;
    width: 105px;
    height: 90px;
    border-radius: 25px;
    background: #263242;
    border: 7px solid #d9e2eb;
    box-shadow: 0 5px 0 rgba(0,0,0,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  #seconds {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 1px;
  }

  .message {
    position: absolute;
    bottom: 5vh;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    border-radius: 30px;
    background: rgba(255,255,255,.9);
    color: #31536c;
    font-size: clamp(20px, 2.5vw, 34px);
    font-weight: 900;
    box-shadow: 0 5px 15px rgba(0,0,0,.12);
  }

  .burst {
    position: absolute;
    left: 50%;
    bottom: 34%;
    transform: translateX(-50%);
    font-size: 42px;
    opacity: 0;
    animation: sparkle 1.6s ease-in-out infinite;
  }
  @keyframes sparkle {
    0%, 35%, 100% { opacity: 0; transform: translateX(-50%) scale(.5); }
    55% { opacity: 1; transform: translateX(-50%) scale(1.1); }
    75% { opacity: 0; transform: translateX(-50%) scale(1.3); }
  }

  .done {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: rgba(255,248,190,.96);
    z-index: 20;
    text-align: center;
  }
  .done.show { display: flex; }
  .done-card {
    padding: 35px;
    border-radius: 35px;
    background: white;
    box-shadow: 0 12px 35px rgba(0,0,0,.18);
  }
  .done-card .emoji { font-size: 90px; }
  .done-card h1 { font-size: clamp(38px, 6vw, 76px); color: #32a852; margin: 10px; }
  .done-card p { font-size: clamp(22px, 3vw, 38px); color: #476276; margin: 0; }
</style>
</head>
<body>
<div class="scene">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div class="title">Almost time!</div>
  <div class="subtitle">Watch the parrot jump & count the seconds.</div>

  <div class="branch"></div>
  <div class="leaf l1"></div>
  <div class="leaf l2"></div>
  <div class="leaf l3"></div>

  <div class="parrot-wrap">
    <div class="burst">✨ 🟡 ✨</div>
    <div class="parrot">
      <div class="tail"></div>
      <div class="belly"></div>
      <div class="wing"></div>
      <div class="head">
        <div class="eye"></div>
        <div class="beak"></div>
        <div class="beak2"></div>
      </div>
      <div class="foot f1"></div>
      <div class="foot f2"></div>

      <div class="watch">
        <div class="watch-strap"></div>
        <div class="watch-face"><span id="seconds">10</span></div>
      </div>
    </div>
  </div>

  <div class="message">Get ready for the next activity! 🌈</div>

  <div class="done" id="done">
    <div class="done-card">
      <div class="emoji">🦜🎉</div>
      <h1>Time to switch!</h1>
      <p>Great job getting ready!</p>
    </div>
  </div>
</div>

<script>
  const allowedDurations = [3, 5, 7];
  const requestedDuration = Number(new URLSearchParams(window.location.search).get("duration"));
  const duration = allowedDurations.includes(requestedDuration) ? requestedDuration : 5;
  let remaining = duration;
  const seconds = document.getElementById("seconds");
  const done = document.getElementById("done");

  function update() {
    seconds.textContent = remaining;
    if (remaining <= 0) {
      done.classList.add("show");
      window.parent.postMessage({ type: "transition-complete" }, "*");
      return;
    }
    remaining--;
    setTimeout(update, 1000);
  }

  update();

  // Click/tap anywhere to restart the transition.
  document.addEventListener("click", () => {
    if (done.classList.contains("show")) {
      done.classList.remove("show");
      remaining = duration;
      update();
    }
  });
</script>
</body>
</html>
